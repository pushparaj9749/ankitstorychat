name: Android APK

# Builds an installable APK with ZERO secrets:
#   expo prebuild  ->  Gradle assembleDebug  ->  artifact (+ Release on tags)
# See README "APK build & signing" for the optional signed-release upgrade.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_androidNdkVersion: 27.0.12077973

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/kissa-v${VERSION}.apk"
          ls -la dist-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kissa-apk
          path: dist-apk/*.apk
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kissa-apk
          path: dist-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
          body: |
            ## Kissa ${{ github.ref_name }} 📖
            Local-first AI story chat. No accounts, no coins, no message limits.
            **[Download the APK below]** and install on Android 8.0+.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
