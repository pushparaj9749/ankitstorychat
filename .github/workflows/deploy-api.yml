name: Deploy story API (Cloudflare Worker)

# Publishes PUBLIC story content + the website to the Cloudflare Worker that
# serves https://beyondredeye.site/api/*. The PRIVATE GitHub repository is the
# story source; only this authenticated CI pipeline reads it — the Worker
# itself holds no GitHub credentials and clients never see the repository.
#
# Flow: push to main → build deploy bundle → tests → wrangler deploy.
#
# Required encrypted repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" scoped token
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id
# The job FAILS with those exact names if they are missing — it never falls
# back to an insecure alternative.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'worker/**'
      - 'website/**'
      - 'assets/covers/**'
      - 'scripts/build-worker-assets.mjs'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  test:
    name: Validate content & worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (app)
        run: npm ci

      - name: Validate story content (schema, scenes, endings, player names)
        run: npm run content:validate

      - name: Install (worker)
        working-directory: worker
        run: npm ci

      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Worker typecheck
        working-directory: worker
        run: npm run typecheck

  deploy:
    name: Deploy Worker
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (worker)
        working-directory: worker
        run: npm ci

      - name: Assemble deploy bundle (content + covers + website)
        working-directory: worker
        run: node ../scripts/build-worker-assets.mjs

      - name: Verify Cloudflare credentials are configured
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not configured (repo Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is not configured (repo Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error title=Deployment blocked::Add the encrypted secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then re-run this job. No insecure fallback is performed."
            exit 1
          fi

      - name: Ensure KISSA_SUBMISSIONS KV namespace exists and wire ids into wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci-kv-setup.mjs
        working-directory: worker/..

      - name: Put ADMIN_TOKEN secret when present
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            echo "Uploading ADMIN_TOKEN secret..."
            echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          else
            echo "::warning title=ADMIN_TOKEN not set::Add a repo secret ADMIN_TOKEN to enable admin routes. Public submission endpoints still work."
          fi

      - name: Deploy (wrangler)
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the deployed API
        run: |
          # End-to-end verification of the live API, on BOTH hostnames.
          #
          # This step FAILS the job (it used to be warn-only) because a Worker
          # route that is missing or shadowed by another Workers/Pages rule does
          # not break the deploy — it silently lets /api/* fall through to the
          # GitHub Pages origin, which answers with its own 404 page. That
          # looked identical to "cache" from the browser and was only ever
          # noticed by hand. A 200 alone is not enough: GitHub Pages also
          # returns 200 for the root, so we additionally require that the
          # response identifies the Worker and carries no GitHub Pages header.
          set -uo pipefail
          base="https://beyondredeye.site/api"
          www_base="https://www.beyondredeye.site/api"
          fails=0
          pass=0
          check() { # check <name> <expected> <actual>
            if [ "$2" = "$3" ]; then echo "✅ $1 (got $3)"; pass=$((pass+1));
            else echo "❌ $1: expected $2, got $3"; fails=$((fails+1)); fi
          }
          code() { out=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@" 2>/dev/null); [ -n "$out" ] && echo "$out" || echo 000; }
          body() { curl -s --max-time 30 "$@" || echo ''; }
          hdrs() { curl -s -D - -o /dev/null --max-time 30 "$@" 2>/dev/null || echo ''; }
          # GitHub Pages always stamps these; the Worker never does.
          from_github_pages() { echo "$1" | grep -qiE '^x-github-request-id:|^via: 1\.1 varnish|^x-served-by: cache-'; }

          # Asserts a hostname's /api/* is served by this Worker, not by the
          # GitHub Pages origin: waits for propagation, then checks status,
          # body identity, and absence of GitHub Pages headers.
          assert_worker_owns_api() { # assert_worker_owns_api <label> <base>
            local label="$1" b="$2" ready=0
            for i in $(seq 1 24); do
              if [ "$(code "$b/health")" = "200" ]; then ready=1; break; fi
              sleep 10
            done
            if [ "$ready" -ne 1 ]; then
              echo "❌ $label: GET $b/health never returned 200 within ~4 min of deploy — the Worker route is not attached or is being shadowed (see docs/DEPLOYMENT.md)."
              fails=$((fails+1))
              return
            fi
            check "$label GET /api/health" "200" "$(code "$b/health")"
            local hb hh
            hb=$(body "$b/health")
            case "$hb" in *kissa-content-api*) echo "✅ $label health body identifies kissa-content-api"; pass=$((pass+1));;
              *) echo "❌ $label health body unexpected: $(echo "$hb" | head -c 120)"; fails=$((fails+1));; esac
            hh=$(hdrs "$b/health")
            if from_github_pages "$hh"; then
              echo "❌ $label /api/health was answered by the GitHub Pages origin, not the Worker — another Workers/Pages rule or a DNS-only record is taking precedence."
              fails=$((fails+1))
            else
              echo "✅ $label /api/health served by the Worker (no GitHub Pages headers)"; pass=$((pass+1))
            fi
            case "$hh" in *[Ss]erver:\ *cloudflare*) echo "✅ $label proxied through Cloudflare (orange cloud)"; pass=$((pass+1));;
              *) echo "❌ $label not served via Cloudflare — DNS record is not proxied, so Worker routes cannot apply."; fails=$((fails+1));; esac
            check "$label GET /api/manifest" "200" "$(code "$b/manifest")"
          }

          assert_worker_owns_api "apex" "$base"
          assert_worker_owns_api "www " "$www_base"

          STORY_DIR=$(node -e "console.log(require('./content/manifest.json').stories[0].storyDir)")
          COVER_NAME=$(ls assets/covers/*.jpg | head -n 1 | xargs basename)

          # 2) Story package, story file, story cover, APK cover.
          check "GET /api/stories/$STORY_DIR (package)" "200" "$(code "$base/stories/$STORY_DIR")"
          check "GET /api/stories/$STORY_DIR/story.json" "200" "$(code "$base/stories/$STORY_DIR/story.json")"
          cover_type=$(curl -s -o /dev/null -w '%{content_type}' --max-time 30 "$base/stories/$STORY_DIR/assets/cover.jpg" || echo '')
          check "GET story cover content-type" "image/jpeg" "$cover_type"
          check "GET /api/covers/$COVER_NAME" "200" "$(code "$base/covers/$COVER_NAME")"

          # 3) CORS: allowed origin reflected, foreign origin refused.
          cors=$(curl -s -o /dev/null -D - -H 'Origin: https://beyondredeye.site' --max-time 30 "$base/manifest" -o /dev/null | grep -i '^access-control-allow-origin:' | tr -d '\r' || echo '')
          case "$cors" in *beyondredeye.site*) echo "✅ CORS allows https://beyondredeye.site"; pass=$((pass+1));; *) echo "⚠️ CORS header missing for allowed origin"; fails=$((fails+1));; esac
          check "foreign Origin refused" "403" "$(code -H 'Origin: https://evil.example' "$base/manifest")"

          # 4) Path traversal blocked.
          check "traversal rejected" "404" "$(code --path-as-is "$base/stories/$STORY_DIR/%2e%2e/%2e%2e/content/manifest.json")"

          # 5) Submission endpoints: public limit GET returns JSON, POST without
          #    body returns 400 (not 500), admin without token returns 401 —
          #    proving the submission Worker routes are live on the deployed URL.
          case "$(body "$base/submit/limit")" in *remaining*) echo "✅ GET /api/submit/limit returns JSON"; pass=$((pass+1));;
            *) echo "❌ GET /api/submit/limit unexpected body"; fails=$((fails+1));; esac
          check "POST idea without body -> 400" "400" "$(code -X POST -H 'Content-Type: application/json' -d '{}' "$base/submit/idea")"
          check "admin/pending without token -> 401" "401" "$(code "$base/admin/pending")"

          # 6) Root website untouched: it must STILL be served by GitHub Pages.
          #    This guards the inverse regression — a Worker route widened to
          #    beyondredeye.site/* would start serving the Worker's asset copy
          #    at / and quietly take the root site off GitHub Pages.
          root_code=$(code https://beyondredeye.site/)
          check "root site still serves" "200" "$root_code"
          root_hdrs=$(hdrs https://beyondredeye.site/)
          if from_github_pages "$root_hdrs"; then
            echo "✅ root / still served by the GitHub Pages origin"; pass=$((pass+1))
          else
            echo "❌ root / is no longer served by GitHub Pages — a Worker/Pages rule has taken over the apex hostname."
            fails=$((fails+1))
          fi

          echo "--- API smoke test: $pass passed, $fails failed ---"
          if [ "$fails" -ne 0 ]; then
            echo "::error title=API smoke test::$fails check(s) failed. The Worker was deployed, but https://beyondredeye.site/api/* is not being served by it. Check the zone DNS records are Proxied and that the route beyondredeye.site/api/* is attached to kissa-content-api (Workers & Pages → kissa-content-api → Settings → Domains & Routes). See docs/DEPLOYMENT.md."
            exit 1
          fi
          echo "::notice title=API smoke test::All $pass checks passed — apex and www both serve /api/* from the Worker and the root stays on GitHub Pages."
