name: Molob edit research

on:
  push:
    branches:
      - arena/6cc276cc-ankitstorychat
    paths:
      - 'scripts/jomm-molob-research/**'
      - '.github/workflows/jomm-molob-research.yml'

permissions:
  contents: write

concurrency:
  group: jomm-molob-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g deno
          python -m pip install yt-dlp pillow numpy requests

      - name: Extract Molob visual references
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/jomm-molob-research
          python scripts/jomm-molob-research/research.py 2>&1 | tee work/jomm-molob-research/run.log

      - name: Publish research review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          destination="docs/clips/jomm-molob-research"
          mkdir -p "$destination"
          if [ -d work/jomm-molob-research/review ]; then
            cp -a work/jomm-molob-research/review/. "$destination/"
          fi
          if [ -f work/jomm-molob-research/run.log ]; then
            cp work/jomm-molob-research/run.log "$destination/run.log"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Update Molob visual research [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
