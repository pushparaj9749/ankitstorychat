name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Typecheck, tests & content validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Check the site's Download APK target is a real APK
        # Regression guard: an edit/clip-pack release once took GitHub's
        # /releases/latest slot, so "Download APK" opened video ZIPs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-live-apk.mjs

      - name: Validate story content
        run: npm run content:validate

  worker:
    name: Story API worker (typecheck & tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Tests (also assembles the deploy bundle)
        working-directory: worker
        run: npm test

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

  # Per-suite matrix: the full-suite job reports 26 files that jest could not
  # even load (e.g. an ESM-only package) as ONE opaque failure whose log this
  # repo's tooling cannot always fetch. Splitting them makes the exact file and
  # error show up as an annotation on the PR.
  suites:
    name: tests · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ota.test.ts
          - appSplashMount.test.tsx
          - submissionStatus.test.ts
          - security.test.ts
          - noOfflineMode.test.ts
          - uiRedesign.test.ts
          - noLengthOrPercent.test.ts
          - updateCheck.test.ts
          - submitRequiresAccount.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ${{ matrix.suite }}
        run: npx jest --coverage=false __tests__/${{ matrix.suite }}
