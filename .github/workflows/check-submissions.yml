name: Check submissions

on:
  workflow_dispatch:
  push:
    branches: ['arena/16ff8a5c-ankitstorychat']
    paths:
      - '.github/workflows/check-submissions.yml'

permissions:
  contents: write

jobs:
  check:
    name: Check pending submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Resolve D1 database
        id: db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          node -e '
            const fs=require("fs");
            const dbs=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));
            const pick=dbs.find(d=>/kissa/i.test(String(d.name||""))) || dbs.find(d=>/account|submission|content/i.test(String(d.name||""))) || dbs[0];
            if(!pick){ console.error("No D1 database found"); process.exit(1); }
            console.log("DB_NAME="+pick.name);
          ' | tee -a "$GITHUB_OUTPUT"

      - name: Query submissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ steps.db.outputs.DB_NAME }}
        run: |
          set -euo pipefail
          echo "DB: $DB_NAME"

          run_query() {
            local label="$1"
            local sql="$2"
            local out="$3"
            echo ""
            echo "===== $label ====="
            npx wrangler d1 execute "$DB_NAME" --remote --command "$sql" --json > "$out"
            cat "$out"
          }

          run_query "PENDING_SUBMISSIONS" \
            "SELECT id, type, status, title, genre, creator_name, submitted_at, expires_at FROM submissions WHERE status='pending' ORDER BY submitted_at DESC LIMIT 50;" \
            /tmp/pending.json

          run_query "SUBMISSION_COUNTS" \
            "SELECT type, status, COUNT(*) AS count FROM submissions GROUP BY type, status ORDER BY type, status;" \
            /tmp/counts.json

          run_query "RECENT_SUBMISSIONS" \
            "SELECT id, type, status, title, creator_name, submitted_at, decided_at FROM submissions ORDER BY submitted_at DESC LIMIT 15;" \
            /tmp/recent.json

          node -e '
            const fs=require("fs");
            function rows(file){
              const raw=JSON.parse(fs.readFileSync(file,"utf8"));
              const arr=Array.isArray(raw)?raw:(raw.result||[]);
              const first=Array.isArray(arr)?arr[0]:arr;
              return first?.results || first?.rows || [];
            }
            const pending=rows("/tmp/pending.json");
            const counts=rows("/tmp/counts.json");
            const recent=rows("/tmp/recent.json");
            const lines=[];
            lines.push("# Submissions check");
            lines.push("");
            lines.push("Generated: " + new Date().toISOString());
            lines.push("");
            lines.push("## Pending");
            lines.push("");
            lines.push("- Pending total: " + pending.length);
            lines.push("- Pending ideas/suggestions: " + pending.filter(r=>r.type==="idea").length);
            lines.push("- Pending story submissions: " + pending.filter(r=>r.type==="story").length);
            lines.push("");
            if(pending.length){
              lines.push("| type | title | creator | submitted_at | id |");
              lines.push("|---|---|---|---|---|");
              for(const r of pending){
                lines.push(`| ${r.type} | ${(r.title||"").replace(/\|/g,"/")} | ${(r.creator_name||"").replace(/\|/g,"/")} | ${r.submitted_at||""} | ${r.id||""} |`);
              }
            } else {
              lines.push("No pending story suggestion/submission.");
            }
            lines.push("");
            lines.push("## Counts by type/status");
            lines.push("");
            lines.push("| type | status | count |");
            lines.push("|---|---:|---:|");
            for(const r of counts){ lines.push(`| ${r.type} | ${r.status} | ${r.count} |`); }
            lines.push("");
            lines.push("## Recent 15");
            lines.push("");
            lines.push("| type | status | title | creator | submitted_at |");
            lines.push("|---|---|---|---|---|");
            for(const r of recent){
              lines.push(`| ${r.type} | ${r.status} | ${(r.title||"").replace(/\|/g,"/")} | ${(r.creator_name||"").replace(/\|/g,"/")} | ${r.submitted_at||""} |`);
            }
            const out = lines.join("\n") + "\n";
            fs.writeFileSync("/tmp/summary.md", out);
            console.log(out);
          '

      - name: Publish result to branch
        run: |
          set -euo pipefail
          cp /tmp/summary.md check-submissions-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-submissions-result.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update submissions check result [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
