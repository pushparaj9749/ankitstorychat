name: Podcast clipping workbench

on:
  push:
    branches: ['arena/fcbfa6df-ankitstorychat']
    paths: ['.github/workflows/podcast-clips.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: arena/fcbfa6df-ankitstorychat
          fetch-depth: 0

      - name: Download completed transcript analysis
        uses: actions/download-artifact@v4
        with:
          name: podcast-transcript-41271165158
          path: .clipping-work
          run-id: 41271165158
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Transfer analysis to the work branch
        run: |
          git config user.name 'arena-clipping-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .clipping-work
          git commit -m 'chore: transfer podcast clipping analysis [skip ci]'
          git push origin HEAD:arena/fcbfa6df-ankitstorychat
