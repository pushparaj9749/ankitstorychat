name: Podcast clipping workbench

on:
  push:
    branches: ['arena/fcbfa6df-ankitstorychat']
    paths:
      - '.github/workflows/podcast-clips.yml'
      - '.clipping-work/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: arena/fcbfa6df-ankitstorychat
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          python -m pip install --upgrade pip
          python -m pip install gdown pillow

      - name: Download the supplied Episode 1 source
        run: |
          mkdir -p work
          python - <<'PY'
          import gdown
          path = gdown.download(id='1_BAuSAmX1qYwz9hLSiIyON0lzi7KTLUx', output='work/episode-1.mp4', quiet=False)
          if not path:
              raise SystemExit('Drive download returned no file')
          PY
          test -s work/episode-1.mp4

      - name: Render and validate vertical clips
        run: |
          set +e
          python .clipping-work/render_clips.py >work/render.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 14 work/render.log | tr '\n' ' ' | cut -c1-1400)
            echo "::error::Clip rendering failed. $message"
            exit "$status"
          fi
          cat work/render.log

      - name: Publish finished clips to the work branch
        run: |
          git config user.name 'arena-clipping-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/clips/worlds-first-podcast
          git commit -m 'feat: add ready-to-upload podcast clips [skip ci]'
          git push origin HEAD:arena/fcbfa6df-ankitstorychat
