name: Escape Halloween clip

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Scout raw footage or build the selected edit
        required: true
        default: scout
        type: choice
        options:
          - scout
          - build

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy pillow

      - name: Scout footage
        if: inputs.mode == 'scout'
        run: python scripts/clips/escape_halloween_scout.py

      - name: Build selected edit
        if: inputs.mode == 'build'
        run: python scripts/clips/escape_halloween_build.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: escape-halloween-${{ inputs.mode }}
          path: |
            work/escape-halloween/scout/**
            work/escape-halloween/final/**
          if-no-files-found: error
          retention-days: 7
