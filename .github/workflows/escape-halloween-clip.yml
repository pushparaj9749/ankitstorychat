name: Escape Halloween clip

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Scout raw footage or build the selected edit
        required: true
        default: scout
        type: choice
        options:
          - scout
          - build
  push:
    branches:
      - arena/6cc276cc-ankitstorychat
    paths:
      - 'scripts/clips/**'
      - '.github/workflows/escape-halloween-clip.yml'

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve clip mode
        id: clip-mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            mode="$(cat scripts/clips/escape_halloween_mode.txt)"
          else
            mode="${{ inputs.mode }}"
          fi
          if [ "$mode" != "scout" ] && [ "$mode" != "build" ]; then
            echo "Invalid clip mode: $mode" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy pillow

      - name: Scout footage
        if: steps.clip-mode.outputs.mode == 'scout'
        run: python scripts/clips/escape_halloween_scout.py

      - name: Build selected edit
        if: steps.clip-mode.outputs.mode == 'build'
        run: python scripts/clips/escape_halloween_build.py

      - name: Publish scouting previews
        if: steps.clip-mode.outputs.mode == 'scout'
        shell: bash
        run: |
          destination="docs/clips/escape-halloween-scout"
          mkdir -p "$destination"
          cp work/escape-halloween/scout/*.jpg work/escape-halloween/scout/report.json "$destination/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Update Escape scouting previews [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish final upload package
        if: steps.clip-mode.outputs.mode == 'build'
        shell: bash
        run: |
          destination="docs/clips/escape-halloween-2026"
          mkdir -p "$destination"
          cp work/escape-halloween/final/* "$destination/"
          if [ -d docs/clips/escape-halloween-scout ]; then
            git rm -r docs/clips/escape-halloween-scout
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Add polished Escape Halloween upload package [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: escape-halloween-${{ steps.clip-mode.outputs.mode }}
          path: |
            work/escape-halloween/scout/**
            work/escape-halloween/final/**
          if-no-files-found: error
          retention-days: 7
