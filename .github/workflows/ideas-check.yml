name: Ideas check

# Kissa — pending story ideas / submissions, twice a day.
#
# 1. fetches the pending list from the production admin endpoint (needs ADMIN_TOKEN)
# 2. prints it in the run summary + check annotations
# 3. mails the list to the maintainer
#
# Email needs two repo secrets (Settings → Secrets and variables → Actions):
#   MAIL_USERNAME  the Gmail address that sends      e.g. ytdjbhai34@gmail.com
#   MAIL_PASSWORD  a Gmail "app password" (16 chars) NOT the account password
#   MAIL_TO        optional, defaults to MAIL_USERNAME
# Without them the job still runs and opens a GitHub issue instead, which GitHub
# mails to you — so the alert never silently disappears.
#
# Schedule (UTC): 00:30 = 06:00 IST, 12:30 = 18:00 IST.
# Cron only fires from the default branch, so this file has to live on main.
# On a feature branch a push that touches this file (or the scripts below) is the
# quickest way to force a one-off check, since workflow_dispatch is not always granted.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API base (default: production)'
        required: false
        default: 'https://beyondredeye.site'
      force_mail:
        description: 'Mail even when nothing is pending'
        type: boolean
        required: false
        default: true
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/ideas-check.yml'
      - 'scripts/admin-ideas.mjs'
      - 'scripts/emit-pending-annotations.mjs'
      - 'scripts/format-ideas-mail.mjs'
      - 'scripts/admin-action.mjs'
      - '.github/admin/queue.txt'
      - 'scripts/send-ideas-mail.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: ideas-check
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the admin secret exists
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error title=ADMIN_TOKEN missing::Repo secret ADMIN_TOKEN is not set."
            exit 1
          fi
          echo "ADMIN_TOKEN present (${#ADMIN_TOKEN} chars)"

      - name: Run queued admin actions
        if: hashFiles('.github/admin/queue.txt') != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE: ${{ inputs.base_url || 'https://beyondredeye.site' }}
        run: node scripts/admin-action.mjs .github/admin/queue.txt

      - name: Fetch pending ideas
        id: fetch
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE: ${{ inputs.base_url || 'https://beyondredeye.site' }}
        run: |
          set -o pipefail
          mkdir -p out
          node scripts/admin-ideas.mjs --url "$BASE" | tee out/pending-ideas.txt
          {
            echo "## Kissa — pending ideas @ ${BASE}"
            echo
            echo '```'
            cat out/pending-ideas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror the list into annotations
        if: always()
        run: node scripts/emit-pending-annotations.mjs out/pending-ideas.txt

      - name: Fail if the token was rejected
        if: always()
        run: |
          if grep -q 'HTTP 401\|HTTP 403' out/pending-ideas.txt 2>/dev/null; then
            echo "::error title=Token rejected::The ADMIN_TOKEN secret does not match the worker."
            exit 1
          fi

      - name: Build the mail
        id: mail
        run: node scripts/format-ideas-mail.mjs out/pending-ideas.txt > out/mail.txt
        env:
          BASE: ${{ inputs.base_url || 'https://beyondredeye.site' }}

      - name: Send the mail
        id: send
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE: ${{ inputs.force_mail || github.event_name == 'schedule' }}
        run: python3 scripts/send-ideas-mail.py out/mail.txt

      - name: Fallback — open an issue if the mail could not be sent
        if: steps.send.outcome != 'success' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing pending? No point opening an issue every 12 hours.
          if head -n 1 out/mail.txt 2>/dev/null | grep -q 'koi pending idea nahi'; then
            echo "::notice title=No mail needed::Kuch pending nahi — issue fallback skip."
            exit 0
          fi
          body=$(cat out/mail.txt 2>/dev/null || echo "out/mail.txt could not be built — see the run summary.")
          { echo "Mail was not sent (no MAIL_USERNAME / MAIL_PASSWORD secret, or SMTP failed)."; echo; echo '```'; echo "$body"; echo '```'; } > out/issue.md
          gh issue create \
            --title "Kissa pending ideas — $(date -u +%Y-%m-%d\ %H:%M) UTC" \
            --body-file out/issue.md || echo "::warning title=Issue not created::Check the issues permission."

      - name: Upload the list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-ideas
          path: |
            out/pending-ideas.txt
            out/mail.txt
          if-no-files-found: warn
          retention-days: 14
