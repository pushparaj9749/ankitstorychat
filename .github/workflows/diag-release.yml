# TEMPORARY diagnostic: probes the Releases API with the Actions GITHUB_TOKEN
# and reports HTTP statuses as annotations (job logs are unreadable from the
# agent sandbox). Delete me once the publish failure is understood.
name: Diag release API

on:
  push:
    branches: ['arena/**']

jobs:
  probe:
    name: Probe Releases API
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Probe generate-notes + create release
        run: |
          set +e
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"

          # 1) generate release notes (what softprops calls when generate_release_notes: true)
          n=$(curl -s -o /tmp/notes -w "%{http_code}" -X POST "$API/releases/generate-notes" \
                -H "$AUTH" -H "Accept: application/vnd.github+json" \
                -d "{\"tag_name\":\"v1.0.6\"}")
          echo "::error title=generate-notes::$n :: $(head -c 300 /tmp/notes | tr -d '\n')"

          # 2) create a throwaway draft release (tests contents: write)
          TAG="diag-$GITHUB_RUN_ID"
          c=$(curl -s -o /tmp/create -w "%{http_code}" -X POST "$API/releases" \
                -H "$AUTH" -H "Accept: application/vnd.github+json" \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"draft\":true}")
          echo "::error title=create-release::$c :: $(head -c 300 /tmp/create | tr -d '\n')"

          # 3) token permissions, as GitHub reports them for this token
          p=$(curl -s -o /dev/null -D /tmp/hdr "$API" -H "$AUTH")
          echo "::error title=token-probe::$p :: $(grep -iE '^(x-oauth-scopes|x-accepted-github-permissions)' /tmp/hdr | tr -d '\r' | tr '\n' ' | ')"

          # cleanup
          id=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('/tmp/create','utf8')).id)}catch(e){console.log('')}" 2>/dev/null)
          if [ -n "$id" ]; then
            curl -s -o /dev/null -X DELETE "$API/releases/$id" -H "$AUTH"
            curl -s -o /dev/null -X DELETE "$API/git/refs/tags/$TAG" -H "$AUTH"
          fi
