# TEMPORARY diagnostic: runs the real softprops action with a throwaway tag to
# isolate where the v1.0.6 publish fails (job logs are unreadable from the
# agent sandbox, so results are reported as check-run annotations).
name: Diag release API

on:
  push:
    branches: ['arena/**']

jobs:
  probe:
    name: Probe release publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make test assets
        run: |
          echo "hello kissa" > small.txt
          head -c 95000000 /dev/urandom > big.bin
          ls -la small.txt big.bin

      - name: softprops with a 12-byte asset
        id: tiny
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-tiny-${{ github.run_id }}
          files: small.txt
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report tiny result
        run: echo "::error title=tiny-asset::outcome=${{ steps.tiny.outcome }}"

      - name: softprops with a 95MB asset
        id: big
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-big-${{ github.run_id }}
          files: big.bin
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report big result
        run: echo "::error title=big-asset::outcome=${{ steps.big.outcome }}"

      - name: Cleanup
        if: always()
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          for t in "diag-tiny-$GITHUB_RUN_ID" "diag-big-$GITHUB_RUN_ID"; do
            id=$(curl -s "$API/releases/tags/$t" -H "$AUTH" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).id)}catch(e){console.log('')}})")
            [ -n "$id" ] && curl -s -o /dev/null -X DELETE "$API/releases/$id" -H "$AUTH"
            curl -s -o /dev/null -X DELETE "$API/git/refs/tags/$t" -H "$AUTH"
          done
          echo "cleanup done"
