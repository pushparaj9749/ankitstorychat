name: Let Him Mansplain clips

on:
  push:
    branches:
      - arena/6cc276cc-ankitstorychat
    paths:
      - 'scripts/lhm-clips/**'
      - '.github/workflows/lhm-clips.yml'

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install yt-dlp

      - name: Inventory episodes and subtitles
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/lhm
          python scripts/lhm-clips/lhm_inventory.py 2>&1 | tee work/lhm/inventory.log

      - name: Publish inventory for review
        shell: bash
        run: |
          destination="docs/clips/lhm-inventory"
          mkdir -p "$destination"
          cp -a work/lhm/inventory/. "$destination/"
          cp work/lhm/inventory.log "$destination/inventory.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "Update LHM source inventory [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
