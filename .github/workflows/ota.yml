name: OTA (JS update, no APK)

# Publishes a small JS/UI change to installed apps WITHOUT a new APK.
#
#   small change  -> this workflow (JS only, signed, instant)
#   native change -> the APK workflow + a new tag (new runtimeVersion)
#
# It refuses to publish when anything native changed since the last APK tag
# (scripts/ota-publish.mjs checks android/, ios/, package.json, assets, …), so a
# JS-only channel can never ship a bundle that expects native code the install
# does not have.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ADMIN_TOKEN — same admin bearer the deploy workflow uses.
#
# OTA_SIGNING_KEY is NOT needed here: the private key lives only in the Worker
# (a wrangler secret), and the Worker signs the manifest at serve time. CI never
# touches it — a compromised runner cannot mint an update.
#
# Run it after merging a small fix to main (or manually with a note).

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Ek line jo app ke "what''s new" me dikhegi'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/certificate.pem'
      - '.github/workflows/ota.yml'
      - 'scripts/ota-publish.mjs'

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish JS update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the native-change guard

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The script exports the JS bundle, uploads it, then re-fetches the
      # manifest and proves the expo-signature header covers exactly the body
      # the app will receive. A publish that the app cannot verify fails here.
      - name: Export & publish
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OTA_NOTES: ${{ inputs.notes }}
          KISSA_API: https://beyondredeye.site/api
        run: node scripts/ota-publish.mjs

      - name: Verify the published manifest
        shell: bash
        run: |
          set -uo pipefail
          V=$(node -p "require('./app.json').expo.version")
          out=$(curl -s -o /tmp/m.json -w '%{http_code}' --max-time 45 \
            "https://beyondredeye.site/api/ota/manifest?platform=android&runtime-version=$V")
          if [ "$out" = "200" ]; then
            node -e "const m=require('/tmp/m.json');if(m.runtimeVersion!=='$V'){console.error('wrong runtime');process.exit(1)};if(!m.launchAsset||!/^[A-Za-z0-9_-]{43}\$/.test(m.launchAsset.hash||'')){console.error('launch asset hash is not base64url sha256');process.exit(1)};console.log('✅ OTA live: runtime',m.runtimeVersion,'seq',m.extra&&m.extra.sequence)"
            # A manifest without expo-signature is an update the app must reject.
            curl -sD /tmp/h.txt -o /dev/null "https://beyondredeye.site/api/ota/manifest?platform=android&runtime-version=$V"
            if ! grep -qi '^expo-signature:' /tmp/h.txt; then
              echo "::error title=OTA manifest unsigned::the app pins a certificate, so it would reject this update"; exit 1
            fi
            echo "✅ manifest signed: $(grep -i '^expo-signature:' /tmp/h.txt | cut -c1-60)…"
          else
            echo "::error title=OTA not live::manifest returned $out"; exit 1
          fi
